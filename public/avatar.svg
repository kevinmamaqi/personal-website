<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#EFEAE2"/>
      <stop offset="100%" stop-color="#E2DBCA"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0.08 0"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="118" fill="url(#paper)"/>
  <rect x="0" y="0" width="240" height="240" filter="url(#grain)" opacity="0.4"/>
  <!-- sketchy portrait silhouette -->
  <g stroke="#171717" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- hair / head -->
    <path d="M58 120 Q 58 60 120 60 Q 182 60 182 120 Q 182 140 178 156"/>
    <!-- jaw -->
    <path d="M68 132 Q 78 178 120 188 Q 162 178 172 132"/>
    <!-- neck -->
    <path d="M96 188 L 96 210 M 144 188 L 144 210"/>
    <!-- shoulders fade -->
    <path d="M48 232 Q 90 206 120 210 Q 150 206 192 232" stroke="#4A4A4A"/>
    <!-- eyes (tiny) -->
    <circle cx="100" cy="124" r="2" fill="#171717"/>
    <circle cx="140" cy="124" r="2" fill="#171717"/>
    <!-- brow -->
    <path d="M88 114 Q 98 110 110 114" stroke="#4A4A4A"/>
    <path d="M130 114 Q 142 110 152 114" stroke="#4A4A4A"/>
    <!-- nose -->
    <path d="M120 130 Q 116 144 122 152"/>
    <!-- mouth -->
    <path d="M108 164 Q 120 170 132 164"/>
  </g>
  <!-- terracotta dot, sketchbook signature -->
  <circle cx="196" cy="48" r="6" fill="#A35C3D"/>
</svg>
